apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.secret.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.secret.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.secret.password | quote }}
  POSTGRES_HOST: "postgres-service.{{ .Values.namespace }}"
  
