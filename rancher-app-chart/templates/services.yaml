apiVersion: v1
kind: Service
metadata:
  name: parentinfo-service
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: parentinfo
  ports:
    - name: http-port-mapping
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgres-parentinfo
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
