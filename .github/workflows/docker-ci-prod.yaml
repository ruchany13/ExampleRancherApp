name: Docker Image CI - Main

on:
  push:
    branches: [ "main" ]
    paths:
    - "app/*"
    - "Docker/*"
    - ".github/*"
    tags:      
      - '*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build-and-push-docker-image:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/ruchany13/parentinfo-prod

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set Image Tag
      id: vars
      run: echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Build the Docker image
      run: docker build . --file Docker/Dockerfile.prod --tag $IMAGE_NAME:$IMAGE_TAG
    
    - name: Tag Docker Image with latest
      run: docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push the Docker image
      run: docker push $IMAGE_NAME:$IMAGE_TAG

    - name: Push the latest
      run: docker push $IMAGE_NAME
    
    - name: Output image details
      run: |
        echo "Docker Image: $IMAGE_NAME:$IMAGE_TAG" 